<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fanta Agente</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
            color: #222;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-top: 0;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .form-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: end;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input, select {
            padding: 9px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 14px;
        }

        input[type="number"] {
            width: 90px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .primary {
            background: #1d7a46;
            color: white;
        }

        .secondary {
            background: #ddd;
            color: #222;
        }

        .danger {
            background: #b3261e;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #222;
            color: white;
            padding: 10px;
            text-align: center;
        }

        td {
            padding: 9px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        td:first-child,
        th:first-child {
            text-align: left;
        }

        .my-team {
            font-weight: bold;
            background: #edf8f1;
        }

        .credits-low {
            font-weight: bold;
            color: #b3261e;
        }

        .history-item {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .empty {
            color: #888;
            font-style: italic;
        }
    </style>
</head>

<body>

    <h1>⚽ Fanta Agente</h1>
    <p class="subtitle">Gestione asta Fantacalcio</p>

    <div class="box">

        <h2>Registra acquisto</h2>

        <div class="form-row">

            <div class="field">
                <label>Giocatore</label>
                <input
                    type="text"
                    id="playerName"
                    placeholder="Es. Dimarco"
                >
            </div>

            <div class="field">
                <label>Ruolo</label>
                <select id="playerRole">
                    <option value="P">Portiere</option>
                    <option value="D">Difensore</option>
                    <option value="C">Centrocampista</option>
                    <option value="A">Attaccante</option>
                </select>
            </div>

            <div class="field">
                <label>Squadra</label>
                <select id="teamSelect"></select>
            </div>

            <div class="field">
                <label>Prezzo</label>
                <input
                    type="number"
                    id="playerPrice"
                    min="1"
                    placeholder="1"
                >
            </div>

            <button class="primary" onclick="registerPurchase()">
                Registra acquisto
            </button>

        </div>

    </div>


    <div class="box">

        <h2>Situazione squadre</h2>

        <table>
            <thead>
                <tr>
                    <th>Squadra</th>
                    <th>Crediti</th>
                    <th>Spesi</th>
                    <th>P</th>
                    <th>D</th>
                    <th>C</th>
                    <th>A</th>
                    <th>% Difesa</th>
                </tr>
            </thead>

            <tbody id="teamTable"></tbody>
        </table>

    </div>


    <div class="box">

        <h2>Ultimi acquisti</h2>

        <div id="history"></div>

        <br>

        <button class="secondary" onclick="undoLastPurchase()">
            ↩ Annulla ultimo acquisto
        </button>

        <button class="danger" onclick="resetAuction()">
            Reset asta
        </button>

    </div>


<script>

const INITIAL_BUDGET = 500;

const defaultTeams = [
    "Arcamadò",
    "Stoke Azzo",
    "Dooger team",
    "Hertha Berlinguer",
    "Jumala FC",
    "Giannimorandisegnama FC",
    "Celtic Glasgow",
    "Athleticul",
    "SS Lekka Milano"
];

let teams = [];
let purchaseHistory = [];

function createTeams() {

    teams = defaultTeams.map((name, index) => ({
        id: index,
        name: name,
        initialBudget: INITIAL_BUDGET,
        credits: INITIAL_BUDGET,

        spent: {
            P: 0,
            D: 0,
            C: 0,
            A: 0
        },

        slots: {
            P: 0,
            D: 0,
            C: 0,
            A: 0
        },

        players: []
    }));
}


function populateTeamSelect() {

    const select = document.getElementById("teamSelect");

    select.innerHTML = "";

    teams.forEach(team => {

        const option = document.createElement("option");

        option.value = team.id;
        option.textContent = team.name;

        select.appendChild(option);
    });
}


function registerPurchase() {

    const name = document
        .getElementById("playerName")
        .value
        .trim();

    const role = document
        .getElementById("playerRole")
        .value;

    const teamId = parseInt(
        document.getElementById("teamSelect").value
    );

    const price = parseInt(
        document.getElementById("playerPrice").value
    );

    if (!name) {
        alert("Inserisci il nome del giocatore.");
        return;
    }

    if (!price || price < 1) {
        alert("Inserisci un prezzo valido.");
        return;
    }

    const team = teams.find(t => t.id === teamId);

    if (price > team.credits) {
        alert(
            team.name +
            " non ha abbastanza crediti."
        );
        return;
    }

    const player = {
        name: name,
        role: role,
        price: price,
        teamId: teamId
    };

    team.players.push(player);

    team.credits -= price;

    team.spent[role] += price;

    team.slots[role] += 1;

    purchaseHistory.push(player);

    saveData();

    render();

    document.getElementById("playerName").value = "";
    document.getElementById("playerPrice").value = "";

    document.getElementById("playerName").focus();
}


function renderTable() {

    const tbody = document.getElementById("teamTable");

    tbody.innerHTML = "";

    teams.forEach(team => {

        const totalSpent =
            INITIAL_BUDGET - team.credits;

        const defencePercentage =
            (
                team.spent.D /
                INITIAL_BUDGET *
                100
            ).toFixed(1);

        const row =
            document.createElement("tr");

        if (team.name === "Arcamadò") {
            row.classList.add("my-team");
        }

        row.innerHTML = `
            <td>${team.name}</td>

            <td class="${team.credits < 100 ? "credits-low" : ""}">
                ${team.credits}
            </td>

            <td>${totalSpent}</td>

            <td>
                ${team.slots.P}
                <small>(${team.spent.P})</small>
            </td>

            <td>
                ${team.slots.D}
                <small>(${team.spent.D})</small>
            </td>

            <td>
                ${team.slots.C}
                <small>(${team.spent.C})</small>
            </td>

            <td>
                ${team.slots.A}
                <small>(${team.spent.A})</small>
            </td>

            <td>
                ${defencePercentage}%
            </td>
        `;

        tbody.appendChild(row);
    });
}


function renderHistory() {

    const history =
        document.getElementById("history");

    history.innerHTML = "";

    if (purchaseHistory.length === 0) {

        history.innerHTML =
            '<div class="empty">Nessun acquisto registrato.</div>';

        return;
    }

    const reversed =
        [...purchaseHistory].reverse();

    reversed
        .slice(0, 15)
        .forEach(player => {

            const team =
                teams.find(
                    t => t.id === player.teamId
                );

            const div =
                document.createElement("div");

            div.className = "history-item";

            div.innerHTML = `
                <strong>${player.name}</strong>
                (${player.role})
                → ${team.name}
                per
                <strong>${player.price}</strong>
            `;

            history.appendChild(div);
        });
}


function undoLastPurchase() {

    if (purchaseHistory.length === 0) {
        alert("Non ci sono acquisti da annullare.");
        return;
    }

    const player =
        purchaseHistory.pop();

    const team =
        teams.find(
            t => t.id === player.teamId
        );

    team.credits += player.price;

    team.spent[player.role] -= player.price;

    team.slots[player.role] -= 1;

    team.players.pop();

    saveData();

    render();
}


function resetAuction() {

    const confirmed = confirm(
        "Vuoi davvero cancellare tutti gli acquisti?"
    );

    if (!confirmed) {
        return;
    }

    createTeams();

    purchaseHistory = [];

    saveData();

    populateTeamSelect();

    render();
}


function saveData() {

    localStorage.setItem(
        "fantaTeams",
        JSON.stringify(teams)
    );

    localStorage.setItem(
        "fantaHistory",
        JSON.stringify(purchaseHistory)
    );
}


function loadData() {

    const savedTeams =
        localStorage.getItem("fantaTeams");

    const savedHistory =
        localStorage.getItem("fantaHistory");

    if (savedTeams) {

        teams =
            JSON.parse(savedTeams);

    } else {

        createTeams();
    }

    if (savedHistory) {

        purchaseHistory =
            JSON.parse(savedHistory);
    }
}


function render() {

    renderTable();
    renderHistory();
}


loadData();

populateTeamSelect();

render();

</script>

</body>
</html>
